[toolchain]
anchor_version = "0.32.1"

[features]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
seeds = false
skip-lint = true

[programs.localnet]
solana_tdp = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.devnet]
solana_tdp = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[test]
# This helps when running 'anchor test' without a pre-started validator
startup_wait = 20000

[test.validator]
url = "http://127.0.0.1:8899"
rpc_port = 8899

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
