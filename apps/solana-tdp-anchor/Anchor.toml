idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
seeds = false
skip-lint = true

[programs.localnet]
solana_tdp = "6VkmhxbTH9dnzAE7Scpxn6R3HeXYtY4oZffAFMAYvECk"

[programs.devnet]
solana_tdp = "6VkmhxbTH9dnzAE7Scpxn6R3HeXYtY4oZffAFMAYvECk"

