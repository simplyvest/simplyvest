name: Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Clear use cases and context help us prioritize.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What is the user or developer frustrated by?
      placeholder: It's tedious to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What does the solution look like? Be specific about behavior, not implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This affects the on-chain program (Solana/Anchor)
        - label: This affects the frontend or SDK
        - label: This is a documentation change
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, references to similar features in other projects.