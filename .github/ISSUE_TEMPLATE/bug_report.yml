name: Bug Report
description: Report a defect or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. The more detail you provide, the faster it can be resolved.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can someone reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does this occur?
      options:
        - Devnet
        - Mainnet
        - Local / test
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (protocol broken, funds at risk)
        - Major (feature unusable)
        - Minor (cosmetic, edge case)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Copy and paste any relevant logs, error messages, or transaction IDs.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else? Screenshots, wallet addresses, program IDs.