name: Deploy API

on:
  workflow_call:
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true

jobs:
  deploy-api:
    runs-on: ubuntu-24.04
    environment: main
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/pnpm-setup
      - name: Apply D1 migrations
        run: pnpm --filter @solana-tdp/api db:migrate:remote
      - name: Deploy API Worker
        run: pnpm --filter @solana-tdp/api run deploy
