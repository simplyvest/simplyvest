name: Deploy Web

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-web:
    needs: []  # Add job dependencies as needed
    runs-on: ubuntu-24.04
    environment: main
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
      VITE_PRIVY_CLIENT_ID: ${{ vars.VITE_PRIVY_CLIENT_ID }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          pnpm config set store-dir ~/.pnpm-store
          echo "store-path=~/.pnpm-store" >> $GITHUB_OUTPUT
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build SDK
        run: pnpm --filter @solana-tdp/sdk build
      - name: Build web app
        run: pnpm --filter @solana-tdp/web build
      - name: Deploy to Cloudflare Pages
        run: pnpm wrangler pages deploy apps/web/dist --project-name=simplyvest
