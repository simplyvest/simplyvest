name: Deploy Web

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-web:
    # Does not use `needs` — protection is via branch protection rules
    # on main. By the time code reaches main, all PR checks have passed.
    runs-on: ubuntu-24.04
    environment: main
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
      VITE_PRIVY_CLIENT_ID: ${{ vars.VITE_PRIVY_CLIENT_ID }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/pnpm-setup
      - name: Build SDK
        run: pnpm --filter @solana-tdp/sdk build
      - name: Build web app
        run: pnpm --filter @solana-tdp/web build
      - name: Deploy to Cloudflare Pages
        run: pnpm wrangler pages deploy apps/web/dist --project-name=simplyvest
