name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  SOLANA_VERSION: "3.1.12"
  ANCHOR_VERSION: "0.32.1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Future jobs to add:
#   lint       — eslint + prettier check across all JS/TS
#   format     — prettier --check
#   test-web   — vitest / jest
#   test-sdk   — SDK tests
#   publish-sdk — npm publish (main only)

jobs:
  typecheck-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check (web)
        run: pnpm --filter @solana-tdp/web check:ts

  typecheck-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check (api)
        run: pnpm --filter @solana-tdp/api typecheck

  build-web:
    needs: typecheck-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter @solana-tdp/web build

  anchor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/solana-tdp-anchor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Cache Solana + Anchor
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana/
            ~/.local/share/anchor/
          key: solana-anchor-${{ runner.os }}-${{ env.SOLANA_VERSION }}-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"

      - name: Install Anchor CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/solana-foundation/anchor/releases/download/v${{ env.ANCHOR_VERSION }}/anchor-${{ env.ANCHOR_VERSION }}-x86_64-unknown-linux-gnu" -o /tmp/anchor
          chmod +x /tmp/anchor
          mkdir -p ~/.local/share/anchor
          mv /tmp/anchor ~/.local/share/anchor/anchor

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/solana-tdp-anchor/programs/solana-tdp"
          key: solana-${{ env.SOLANA_VERSION }}
          cache-on-failure: true

      - name: Set up PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/anchor" >> $GITHUB_PATH

      - name: Generate keypair
        run: solana-keygen new --no-bip39-passphrase --silent -f

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build program (BPF)
        run: anchor build

      - name: Stage program binary
        run: mkdir -p target/deploy && cp programs/solana-tdp/target/deploy/solana_tdp.so target/deploy/

      - name: Run tests
        run: anchor test --skip-build

  deploy-web:
    if: github.ref == 'refs/heads/main'
    needs: typecheck-web
    runs-on: ubuntu-24.04
    environment: main
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter @solana-tdp/web build
      - name: Deploy to Cloudflare Pages
        run: pnpm wrangler pages deploy apps/web/dist --project-name=simplyvest

  deploy-api:
    if: github.ref == 'refs/heads/main'
    needs: typecheck-api
    runs-on: ubuntu-24.04
    environment: main
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy API Worker
        run: pnpm --filter @solana-tdp/api deploy
