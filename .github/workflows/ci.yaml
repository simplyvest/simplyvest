name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ANCHOR_VERSION: "0.32.1"
  SOLANA_VERSION: "2.3.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check (web)
        run: pnpm --filter @solana-tdp/web check:ts

  anchor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/solana-tdp-anchor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: metadaoproject/setup-anchor@v3.3
        with:
          anchor-version: ${{ env.ANCHOR_VERSION }}
          solana-cli-version: ${{ env.SOLANA_VERSION }}
          node-version: "22"
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Build program (BPF)
        run: anchor build
      - name: Stage program binary
        run: mkdir -p target/deploy && cp programs/solana-tdp/target/deploy/solana_tdp.so target/deploy/
      - name: Run tests
        run: anchor test --skip-build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter @solana-tdp/web build
