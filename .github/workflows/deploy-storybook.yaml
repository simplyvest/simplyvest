name: Deploy Storybook

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true

jobs:
  deploy-storybook:
    runs-on: ubuntu-24.04
    environment: main
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/pnpm-setup
      - name: Build SDK
        run: pnpm --filter @solana-tdp/sdk build
      - name: Build Storybook
        run: pnpm --filter @simplyvest/storybook build-storybook
      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @simplyvest/storybook run deploy
